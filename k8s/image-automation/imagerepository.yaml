# Phase 8 (T-0037): the Flux image objects for the three house-built images.
# The registry URLs are the PRODUCTION references (ghcr.io/urmanac/chudmax/*) —
# published since the phase-10 milestone (public packages, so the anonymous
# scans resolve); the rehearsal renders the in-cluster registry stand-in
# (rehearsal/imagerepository-rehearsal.yaml) and this file is the production
# shape it mirrors.
#
# Namespace convention (k8s/repo-sync/): no in-manifest namespace — apply with
# -n flux-system. hermes-agent has NO ImageRepository by design: the Hermes
# chart (urmanac/hermes-agent since the phase-10 split) consumes upstream
# nousresearch/hermes-agent semver tags chosen manually — the automation loop
# is for the images we build.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: chudmax-fetcher
spec:
  interval: 5m
  image: ghcr.io/urmanac/chudmax/fetcher
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: chudmax-tickets-mcp
spec:
  interval: 5m
  image: ghcr.io/urmanac/chudmax/tickets-mcp
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: chudmax-web
spec:
  interval: 5m
  image: ghcr.io/urmanac/chudmax/web
