{{- if and .Values.networkPolicy.enabled .Values.server.enabled }}
# Ingress to the optional server's port: same-namespace pods always, extra
# sources from values. Rendered only when the server is enabled.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chudmax-mcp.fullname" . }}-ingress
  labels:
    {{- include "chudmax-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chudmax-mcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: {{ .Values.server.port }}
    {{- with .Values.networkPolicy.ingress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
