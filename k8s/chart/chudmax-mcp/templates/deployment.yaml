apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chudmax-mcp.fullname" . }}
  labels:
    {{- include "chudmax-mcp.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "chudmax-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chudmax-mcp.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "chudmax-mcp.serviceAccountName" . }}
      # Pod-level (the only level this field exists at — F3, T-0037 phase 4b).
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fetcher
          image: {{ include "chudmax-mcp.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - watch
            - --namespace
            - $(POD_NAMESPACE)
            - --name
            - {{ .Values.externalArtifact.name | quote }}
            - --root
            - {{ .Values.fetcher.root }}
            - --resync
            - {{ .Values.fetcher.resync }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: data
              mountPath: {{ .Values.fetcher.root }}
            # The projected token: short-lived (kubelet-refreshed) plus the
            # cluster CA, mounted at the standard path so the in-cluster
            # client config keeps working. The pod-level automount above is
            # off — only this mount carries credentials into the pod.
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          readinessProbe:
            # /data/current exists once the first verified artifact has been
            # swapped in; before that the sidecar is not ready (honest state).
            exec:
              command: ["test", "-e", "{{ .Values.fetcher.root }}/current"]
          resources:
            {{- toYaml .Values.fetcher.resources | nindent 12 }}
        {{- if .Values.server.enabled }}
        - name: server
          image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- with .Values.server.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.server.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.server.auth.enabled }}
            - --bearer-token-file
            - /var/run/mcp-auth/token
          {{- end }}
          {{- with .Values.server.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port }}
          # The MCP surface must be alive, not just the process: the probe
          # POSTs list_tickets and asserts HTTP 200 (GET /mcp is a 405). It
          # reads the bearer token file WHEN PRESENT (auth on: the header is
          # sent — a headerless POST would 401; auth off: the read fails and
          # the header is skipped), so one static command covers both variants.
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import json, sys, urllib.request
                  headers = {"Content-Type": "application/json"}
                  try:  # bearer auth (the mounted token, read per probe)
                      headers["Authorization"] = "Bearer " + open("/var/run/mcp-auth/token").read().strip()
                  except OSError:
                      pass
                  req = urllib.request.Request(
                      "http://127.0.0.1:{{ .Values.server.port }}/mcp",
                      data=json.dumps({"jsonrpc": "2.0", "id": 1, "method": "tools/call",
                                       "params": {"name": "list_tickets", "arguments": {}}}).encode(),
                      headers=headers)
                  try:
                      r = urllib.request.urlopen(req, timeout=3)
                      sys.exit(0 if r.status == 200 else 1)
                  except Exception:
                      sys.exit(1)
          volumeMounts:
            - name: data
              mountPath: {{ .Values.fetcher.root }}
          {{- if .Values.server.auth.enabled }}
            - name: mcp-auth
              mountPath: /var/run/mcp-auth
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
        {{- end }}
      volumes:
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.volume.sizeLimit }}
        # The fetcher's bounded, auto-refreshed token + the cluster CA.
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- if .Values.server.auth.enabled }}
        - name: mcp-auth
          secret:
            secretName: {{ .Values.server.auth.secretName | quote }}
            items:
              - key: {{ .Values.server.auth.secretKey | quote }}
                path: token
        {{- end }}
