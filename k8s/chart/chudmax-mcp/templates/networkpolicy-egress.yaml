apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chudmax-mcp.fullname" . }}-egress
  labels:
    {{- include "chudmax-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chudmax-mcp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.egress.dns.selector | nindent 14 }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if eq .Values.networkPolicy.egress.apiServer.mode "cidr" }}
    # the kube-apiserver by service CIDR (the ipBlock alternative; unreliable
    # under Cilium, which resolves the apiserver to its backends - F5)
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.egress.apiServer.cidr | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- else }}
    # the kube-apiserver by its static pods' labels - Cilium matches policy on
    # the resolved backend, so the podSelector pattern is the portable default
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.apiServer.selector.namespace }}
          podSelector:
            matchLabels:
              component: {{ .Values.networkPolicy.egress.apiServer.selector.component }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    # the artifact server: source-watcher's storage serves the generated
    # artifact (status.artifact.url points there) - scoped to that
    # controller's pods, not the whole namespace (F4)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.egress.sourceController.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.egress.sourceController.selector | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.sourceController.port }}
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
