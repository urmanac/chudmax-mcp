{{- if and .Values.apiServer.enabled (not .Values.apiServer.key) (not .Values.apiServer.existingSecret) }}
{{- fail "hermes-agent: apiServer.enabled requires apiServer.key (a literal, rehearsal-only test strings acceptable) or apiServer.existingSecret (the placement path) — the upstream API server refuses to run without its bearer key" }}
{{- end }}
{{- $sc := merge (dict "seccompProfile" (dict "type" "RuntimeDefault")) (deepCopy (.Values.securityContext | default dict)) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hermes-agent.fullname" . }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Upstream's own rule: never run two gateway processes against one data
  # directory (session files and memory stores are single-writer, state.db is
  # SQLite). Recreate — never RollingUpdate with this chart's RWO PVC.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hermes-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hermes-agent.selectorLabels" . | nindent 8 }}
    spec:
      # No k8s API token, no RBAC: the agent has no cluster role here.
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      # NO runAsNonRoot (the documented deviation): the image's s6-overlay
      # /init runs the stage2 hook as ROOT by design (volume chown, HERMES_UID
      # remap, first-boot seeding) and then drops every supervised service to
      # UID 10000 via s6-setuidgid. Forcing non-root at container start breaks
      # the stage2 window; capabilities.drop: ALL would break chown/setuid.
      # seccompProfile: RuntimeDefault stays (merged with values.securityContext).
      securityContext:
        {{- toYaml $sc | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: hermes
          image: {{ include "hermes-agent.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The compose deployment shape: the s6-supervised gateway. Rendered as
          # ARGS (entrypoint preserved) — k8s `command` would replace the image's
          # entrypoint dispatcher (run #8's receipt). No args override = the
          # interactive TUI — never what a Service-backed pod runs.
          args:
            {{- toYaml .Values.args | nindent 12 }}
          env:
            {{- if .Values.apiServer.enabled }}
            - name: API_SERVER_ENABLED
              value: "true"
            # Bind all interfaces: the Service reaches the POD IP, not the
            # container's loopback (the mcp chart's phase-4b lesson).
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: {{ .Values.apiServer.port | quote }}
            - name: API_SERVER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "hermes-agent.apiKeySecretName" . }}
                  key: {{ .Values.apiServer.existingSecretKey | default "API_SERVER_KEY" }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.apiServer.port }}
          {{- if .Values.apiServer.enabled }}
          # Probes ride the PUBLIC cheap route (no auth needed by design):
          # GET /health → {"status": "ok"}. /health/detailed is the
          # authenticated readiness check — documented for operators, not probes.
          # The gateway boots inside the s6 tree (stage2 chown, config
          # migrations, venv warm-up can take tens of seconds) — a generous
          # startup probe absorbs it.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 5
          {{- end }}
          volumeMounts:
            - name: home
              mountPath: /opt/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: {{ include "hermes-agent.fullname" . }}
