{{- if and .Values.apiServer.enabled .Values.apiServer.key (not .Values.apiServer.existingSecret) }}
# The chart-created Secret for the API server's bearer key. Rendered only when
# a literal key is given AND no existing Secret is referenced — the placement
# path (existingSecret) never renders this.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermes-agent.fullname" . }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.apiServer.existingSecretKey | default "API_SERVER_KEY" }}: {{ .Values.apiServer.key | quote }}
{{- end }}
