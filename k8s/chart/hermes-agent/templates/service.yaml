{{- if .Values.apiServer.enabled }}
# The API server's front door: the ONE Service this chart renders. Nothing
# points at a pod that serves nothing (the API-server-off mode renders no
# Service, no probes — documented).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hermes-agent.fullname" . }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "hermes-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.apiServer.port }}
      targetPort: http
{{- end }}
