# HERMES_HOME (/opt/data): the whole agent home. The PVC survives pod deletes
# (PVC ≠ pod) and Recreate keeps single-writer discipline; the disaster case
# (lost volume) is covered by hermes backup / hermes import (see NOTES + README).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hermes-agent.fullname" . }}
  labels:
    {{- include "hermes-agent.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.storage.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size }}
