# Default values for the hermes-agent chart (T-0037 phase 9).
# The chart consumes the UPSTREAM image — nothing is built in this phase.
# The upstream image is root-then-drop by design: s6-overlay's /init runs the
# stage2 hook as root (UID remap, volume chown, first-boot seeding of
# .env/config.yaml/SOUL.md, skills sync) and then every supervised service
# drops to UID 10000 via s6-setuidgid. The chart therefore does NOT set
# runAsNonRoot — a documented deviation from the mcp chart's pattern (README).

nameOverride: ""
fullnameOverride: ""

image:
  # Upstream's semver-tagged multi-arch image (amd64 + arm64 manifest list).
  # v0.23.4 was the `stable` digest on 2026-11-26 (manifest list
  # sha256:ef0650d523ee1b5ab32c779acabc446d9936869a9932591553688a62bcf0c42f).
  repository: nousresearch/hermes-agent
  tag: "v0.23.4"
  pullPolicy: IfNotPresent
  # Pin by digest for exact deployments (digest wins over tag when set) —
  # upstream's own recommendation for deployments.
  digest: ""

# Pod-level: no k8s API token, no RBAC, no host mounts. The agent has no
# cluster role here — nothing in the chart reads or writes the API.
automountServiceAccountToken: false

# The container args: the docker-compose deployment shape. Rendered as the
# container's `args` (NOT `command`) — k8s `command` would REPLACE the image's
# entrypoint dispatcher and exec a bare `gateway` (the CI receipt, run #8:
# `exec: "gateway": executable file not found in $PATH`); `args` keeps the
# dispatcher and routes to `hermes gateway run`, supervised by s6 inside the
# image. The API server + /health surface rides this process (apiServer below).
args: ["gateway", "run"]

# THE exposed interface: the OpenAI-compatible API server on :8642 — the one
# programmatic HTTP surface designed for external clients. The bearer key is
# MANDATORY upstream for every deployment (even loopback). GET /health is the
# public cheap route (no auth) and is what the probes use; /health/detailed is
# the authenticated readiness check operators may want for control planes.
# The dashboard (HERMES_DASHBOARD=1, :9119) and webapp (:9120) fail closed on
# non-loopback binds without an auth provider (the June 2026 hardening) — they
# are OFF here; enabling them is an operator recipe in the README, not a knob.
apiServer:
  enabled: true
  port: 8642
  # The bearer key. Two ways to supply it:
  #   key:             a literal string — the chart creates an Opaque Secret
  #                    (rehearsal installs pass a clearly-labeled non-secret
  #                    test string; NEVER a real credential in values)
  #   existingSecret:  the name of an existing Secret — its
  #                    existingSecretKey carries the key (the placement path;
  #                    the secrets mechanism is the human's phase-12 decision)
  # A render guard fails the template when enabled but neither is set: the
  # API server refuses to run without a key upstream.
  key: ""
  existingSecret: ""
  existingSecretKey: "API_SERVER_KEY"

storage:
  # HERMES_HOME (/opt/data): the whole agent home — config.yaml, .env,
  # SOUL.md, memories/, sessions/ (state.db, WAL), skills/, profiles/, cron/,
  # hooks/, skins/, home/, plugins/, auth.json. See the README for what must
  # be backed up and the regenerable trio (cache/, installs/, logs/).
  size: 2Gi
  # Empty = the cluster default class. kind ships rancher.io/local-path as
  # its `standard` class — the rehearsal's provisioner (node-local ext4, so
  # SQLite's WAL journal mode applies unchanged; the corruption class upstream
  # documents is virtiofs/9p/NFS, not this).
  storageClass: ""

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 4Gi

# The gateway drains on SIGTERM (runs are persisted as `interrupted`); give it
# room. Upstream's minimum memory is 1 GB (2-4 GB with browser tools — the
# image ships full Chromium).
terminationGracePeriodSeconds: 60

# Passthrough for everything the chart does not first-class: HERMES_UID /
# HERMES_GID (the stage2 remap; default UID 10000), provider API keys,
# API_SERVER_CORS_ORIGINS, HERMES_DASHBOARD=1 + its auth vars, etc. Direct
# environment overrides .env values (documented upstream).
extraEnv: []

# Pod-level securityContext passthrough. The default always includes
# seccompProfile: RuntimeDefault; keys here are merged OVER the default.
# Do NOT add runAsNonRoot (breaks the stage2 root window — README).
securityContext: {}

# The Helm test hook (curlimages/curl): GET /health → 200 and
# authenticated GET /v1/models → 200 through the Service. Runs only on
# explicit `helm test`.
test:
  enabled: true
