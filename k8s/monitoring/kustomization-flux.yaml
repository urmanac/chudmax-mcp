# The Flux reconciliation entry points — upstream's clusters/test/monitoring.yaml,
# repointed at chudmax's tree. The controllers build (the Prometheus stack)
# reconciles BEFORE the configs build (the PodMonitors/ServiceMonitors/
# PrometheusRules/MetricTemplates need the operator's CRDs to exist first).
#
# Prerequisite (documented in k8s/monitoring/README.md): a GitRepository named
# chudmax-mcp pointing at THIS public repo — the name flux bootstrap gives the
# fleet repo. No credential involved (the repo is public); phase 12's platform
# inventory owns the real wiring and may rename it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-controllers
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: chudmax
    app.kubernetes.io/component: monitoring
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: chudmax-mcp
  path: ./k8s/monitoring/controllers
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring-configs
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: chudmax
    app.kubernetes.io/component: monitoring
spec:
  dependsOn:
    - name: monitoring-controllers
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: chudmax-mcp
  path: ./k8s/monitoring/configs
