# The controllers profile: the Prometheus stack itself, from the upstream
# flux2-monitoring-example shape (monitoring/controllers/kustomization.yaml).
# Upstream's loki-stack and minio controllers are omitted by design — no log
# pipeline or object storage in chudmax's contract; only kube-prometheus-stack.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - namespace.yaml
  - kube-prometheus-stack
