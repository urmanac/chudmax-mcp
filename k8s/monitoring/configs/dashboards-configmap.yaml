# The Grafana overview dashboard, as a static ConfigMap so its namespace is
# pinned like every other object (kustomize patches cannot target generated
# resources — the configMapGenerator route left the namespace to deploy time).
# The kube-prometheus-stack Grafana sidecar picks ConfigMaps labeled
# grafana_dashboard: "1" up when Grafana is enabled (values-gated in this
# profile's HelmRelease); the sidecar's searchNamespace must include
# `monitoring` (kube-prometheus-stack defaults it to ALL — verify when
# enabling). The JSON is the whole dashboard: Flux must not var-substitute it
# (kustomize.toolkit.fluxcd.io/substitute: disabled).
apiVersion: v1
kind: ConfigMap
metadata:
  name: chudmax-grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: chudmax
    app.kubernetes.io/component: monitoring
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  chudmax-overview.json: |
    {
      "title": "Chudmax overview",
      "uid": "chudmax-overview",
      "tags": ["chudmax"],
      "timezone": "browser",
      "schemaVersion": 39,
      "editable": true,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "label": "Prometheus",
            "type": "datasource",
            "query": "prometheus",
            "hide": 2,
            "current": { "text": "default", "value": "default" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Flux resources not ready",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "expr": "count(gotk_resource_info{ready=\"False\"}) or on() vector(0)",
              "legendFormat": "not ready",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "value", "graphMode": "none" }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Canary weight & failed checks",
          "gridPos": { "h": 8, "w": 9, "x": 6, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "expr": "gotk_canary_canary_weight",
              "legendFormat": "{{ exported_namespace }}/{{ name }} weight %",
              "refId": "A"
            },
            {
              "expr": "gotk_canary_failed_checks",
              "legendFormat": "{{ exported_namespace }}/{{ name }} failed checks",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 } }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Traefik requests/s by service",
          "gridPos": { "h": 8, "w": 9, "x": 15, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "expr": "sum(rate(traefik_service_requests_total[5m])) by (service)",
              "legendFormat": "{{ service }}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 } }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Traefik non-5xx rate %",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "expr": "100 - 100 * (sum(rate(traefik_service_requests_total{code=~\"5..\"}[5m])) / sum(rate(traefik_service_requests_total[5m])))",
              "legendFormat": "non-5xx %",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 99 }
                ]
              }
            },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Strata TTFT p95 (LLM prefill)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(vllm:time_to_first_token_seconds_bucket[5m])) by (le))",
              "legendFormat": "TTFT p95",
              "refId": "A"
            },
            {
              "expr": "max(vllm:num_requests_waiting)",
              "legendFormat": "queued requests",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 } }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Token throughput (prompt / generation)",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "expr": "sum(rate(vllm:prompt_tokens_total[5m]))",
              "legendFormat": "prompt tok/s",
              "refId": "A"
            },
            {
              "expr": "sum(rate(vllm:generation_tokens_total[5m]))",
              "legendFormat": "generation tok/s",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ops", "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 } }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Strata GPU util & VRAM",
          "gridPos": { "h": 7, "w": 6, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "expr": "strata:gpu_util",
              "legendFormat": "gpu {{ gpu }} util %",
              "refId": "A"
            },
            {
              "expr": "100 * strata:gpu_mem_used_bytes / strata:gpu_mem_total_bytes",
              "legendFormat": "gpu {{ gpu }} VRAM %",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100, "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 } }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Strata GPU temperature & power",
          "gridPos": { "h": 7, "w": 6, "x": 18, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" },
          "targets": [
            {
              "expr": "strata:gpu_temp_celsius",
              "legendFormat": "gpu {{ gpu }} °C",
              "refId": "A"
            },
            {
              "expr": "strata:gpu_power_watts",
              "legendFormat": "gpu {{ gpu }} W",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10 } }, "overrides": [] },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        }
      ]
    }
