{{- if .Values.test.enabled }}
# "First test of any cluster": a pod reaching /health through the engine
# Service. Runs only on an explicit `helm test <release>` — the same hook
# rehearses the bridge mock engine on kind (phase 6) and the real engine on the
# platform (phase 11). With the endpoint unset this fails by design.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "chudmax-engine.fullname" . }}-health-test
  labels:
    {{- include "chudmax-engine.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: "{{ .Values.test.image.repository }}:{{ .Values.test.image.tag }}"
      imagePullPolicy: IfNotPresent
      args:
        - -fsS
        - --max-time
        - "10"
        - http://{{ include "chudmax-engine.fullname" . }}:{{ .Values.service.port }}/health
{{- end }}
