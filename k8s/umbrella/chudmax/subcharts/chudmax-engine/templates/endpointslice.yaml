{{- if .Values.endpoint.host }}
# The manual endpoint: the external engine's address, installer-supplied.
# Rendered only when endpoint.host is set. The port name matches the Service's
# targetPort ("http"); the port NUMBER is the engine's own (endpoint.port) —
# the two are deliberately decoupled. Endpoint IPs must not be ClusterIPs, so
# this names a real host: the LAN address in production (phase 11+), the docker
# bridge in the kind rehearsal.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: {{ include "chudmax-engine.fullname" . }}-endpoints
  labels:
    kubernetes.io/service-name: {{ include "chudmax-engine.fullname" . }}
    {{- include "chudmax-engine.labels" . | nindent 4 }}
addressType: IPv4
endpoints:
  - addresses:
      - {{ .Values.endpoint.host | quote }}
ports:
  - name: http
    port: {{ .Values.endpoint.port }}
    protocol: TCP
{{- end }}
