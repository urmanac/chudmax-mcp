# Default values for the chudmax-engine chart.
# This chart is a POINTER, not a workload: a Service without a selector whose
# manual EndpointSlice names the external engine's address. The engine runs
# where it runs (the GPU host); nothing here pretends to be it.

nameOverride: ""
fullnameOverride: ""

service:
  # The client-facing port — the stable in-cluster name is
  # http://<fullname>.<namespace>.svc:<this port>.
  port: 8080

endpoint:
  # SET THIS TO YOUR ENGINE'S ADDRESS — the host of the external engine this
  # Service points at (an IP or a DNS name). Left empty, the chart renders the
  # Service with no endpoints (the EndpointSlice is skipped) and NOTES.txt
  # reminds you. The real address is installer-supplied and never committed:
  # same hygiene as credentials (CI templates use RFC 5737 documentation IPs).
  host: ""
  # The port the engine listens on AT THAT HOST — the EndpointSlice port. It is
  # deliberately decoupled from the client-facing Service port above (named
  # ports connect them), so the engine can move or change ports without
  # touching any client.
  port: 8080

test:
  # The "first test of any cluster": a Helm test hook pod that curls /health
  # through the Service. Runs only on an explicit `helm test <release>`; with
  # the endpoint unset it fails by design — set the address first.
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.12.1"
