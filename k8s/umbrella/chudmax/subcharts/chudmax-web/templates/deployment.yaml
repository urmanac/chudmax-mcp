apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chudmax-web.fullname" . }}
  labels:
    {{- include "chudmax-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "chudmax-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chudmax-web.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: {{ include "chudmax-web.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Strata's serve.server with the in-process MockEngine (--engine
          # mock): real /health, /mcp and /v1/chat/completions, zero GPU. The
          # bind is 0.0.0.0 — the Service reaches the POD IP, not container
          # localhost (the 4b smoke's --host lesson).
          command: ["python", "-m", "serve.server"]
          args:
            - --engine
            - {{ .Values.engineMode | quote }}
            - --host
            - 0.0.0.0
            - --port
            - {{ .Values.port | quote }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
            {{- if .Values.mcpConfig }}
            # The hub config (the inline ConfigMap above): the LAST args pair,
            # index 6/7 of the rendered list — the phase-7 broken-upgrade patch
            # swaps index 7 to the broken-config path (the index is derived
            # from the rendered template at runtime, never hard-coded).
            - --mcp-config
            - /etc/strata/mcp-config.json
            {{- end }}
          env:
            # The DNS-rebinding guard: without an API key every request passes
            # the Host check first; in-cluster calls send the Service DNS name.
            - name: STRATA_ALLOWED_HOSTS
              value: {{ include "chudmax-web.allowedHosts" . | quote }}
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probe.path }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: {{ .Values.probe.path }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.mcpConfig }}
          volumeMounts:
            # The hub config file (subPath: the ConfigMap's one key as a file,
            # read-only). The comment above the args explains the index.
            - name: mcp-config
              mountPath: /etc/strata/mcp-config.json
              subPath: config.json
              readOnly: true
          {{- end }}
      {{- if .Values.mcpConfig }}
      volumes:
        - name: mcp-config
          configMap:
            name: {{ include "chudmax-web.fullname" . }}-mcp-config
      {{- end }}
