apiVersion: v2
name: chudmax
description: >-
  The ChudMax umbrella: the engine pointer chart, the web (Strata with its
  in-process mock engine) and the mcp pod (fetcher + the published canonical
  ticket server) as one install. The rehearsal (kind-smoke.sh) proves the
  engine-Service /health path against a mock engine outside the cluster.
type: application
version: 0.1.0
appVersion: "0.1.0"

# The three children live in this checkout for now: the engine and web charts
# are in-tree subcharts (they move to urmanac/chudmax-engine and -web at the
# phase-10 publishing milestone), the mcp chart is referenced read-only from
# k8s/chart/chudmax-mcp. `helm dependency build` copies them into charts/
# (gitignored). At phase 10 these file:// repositories flip to published OCI
# references.
dependencies:
  - name: chudmax-engine
    alias: engine
    version: 0.1.0
    repository: file://subcharts/chudmax-engine
    condition: engine.enabled
  - name: chudmax-web
    alias: web
    version: 0.1.0
    repository: file://subcharts/chudmax-web
    condition: web.enabled
  - name: chudmax-mcp
    alias: mcp
    version: 0.1.0
    repository: file://../../chart/chudmax-mcp
    condition: mcp.enabled
