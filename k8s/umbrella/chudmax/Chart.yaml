apiVersion: v2
name: chudmax
description: >-
  The ChudMax umbrella: the engine pointer chart, the web (Strata with its
  in-process mock engine) and the mcp pod (fetcher + the published canonical
  ticket server) as one install. The rehearsal (kind-smoke.sh) proves the
  engine-Service /health path against a mock engine outside the cluster.
type: application
version: 0.1.0
appVersion: "0.1.0"

# GHCR links a published chart package to its repo via this annotation (the
# umbrella is not published in phase 10; set for the future OCI publish).
annotations:
  org.opencontainers.image.source: https://github.com/urmanac/chudmax-mcp

# The engine and web charts are published from their own public repos since the
# phase-10 split (urmanac/chudmax-engine, urmanac/chudmax-web — OCI refs below);
# the mcp chart remains in-tree, referenced read-only from k8s/chart/chudmax-mcp.
# `helm dependency update` resolves the OCI deps (credential-free once the
# packages are public) and copies everything into charts/ (gitignored).
dependencies:
  - name: chudmax-engine
    alias: engine
    version: 0.1.0
    repository: oci://ghcr.io/urmanac/chudmax-engine
    condition: engine.enabled
  - name: chudmax-web
    alias: web
    version: 0.1.0
    repository: oci://ghcr.io/urmanac/chudmax-web
    condition: web.enabled
  - name: chudmax-mcp
    alias: mcp
    version: 0.1.0
    repository: file://../../chart/chudmax-mcp
    condition: mcp.enabled
