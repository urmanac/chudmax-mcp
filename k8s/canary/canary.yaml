# The Canary CRD on the web Deployment — the phase-7 rehearsal's analysis
# object. Flagger steps the HTTPRoute's backendRef weights 10% at a time to 50%
# and promotes; the pre-rollout suite gates every step and the load-test
# webhook drives chat completions through the gateway so the finish-rate
# metric has data (only chat turns FINISH engine requests).
#
# The Traefik Service URL (${TRAEFIK_URL}, e.g. http://traefik.chudmax) is
# envsubst'd by canary-rehearse.sh — derived from the live cluster, never
# assumed. The route host is a rehearsal doc name, not a real domain.
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: chudmax-web
  namespace: chudmax
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: chudmax-web
  progressDeadlineSeconds: 60
  service:
    port: 8080
    targetPort: 8080
    hosts:
      - chudmax.rehearsal
    gatewayRefs:
      - name: chudmax-gateway
        namespace: chudmax
  analysis:
    interval: 1m
    threshold: 5
    maxWeight: 50
    stepWeight: 10
    metrics:
      - name: request-finish-rate
        templateRef:
          name: request-finish-rate
          namespace: chudmax
        thresholdRange:
          min: 0.01
        interval: 1m
      - name: request-duration-p99
        templateRef:
          name: request-duration-p99
          namespace: chudmax
        thresholdRange:
          max: 0.5
        interval: 1m
    webhooks:
      - name: smoke-test
        type: pre-rollout
        url: http://loadtester.chudmax/
        timeout: 60s
        metadata:
          type: bash
          cmd: |
            set -eu
            W=http://chudmax-web-canary.chudmax:8080
            P=http://chudmax-web-primary.chudmax:8080
            # 1) /health through the canary Service
            curl -fsS --max-time 5 "$W/health" > /dev/null
            # 2) the hub's tool surface: byte-equal primary vs canary, tickets present
            #    (retry: the hub registers its servers asynchronously)
            PT=""; CT=""; i=0
            while [ $i -lt 15 ]; do
              PT=$(curl -fsS --max-time 5 "$P/v1/mcp/tools" 2>/dev/null || true)
              CT=$(curl -fsS --max-time 5 "$W/v1/mcp/tools" 2>/dev/null || true)
              if [ -n "$PT" ] && [ -n "$CT" ] && [ "$PT" = "$CT" ] \
                 && printf '%s' "$CT" | grep -q tickets__list_tickets; then
                break
              fi
              i=$((i+1)); sleep 2
            done
            [ -n "$PT" ] && [ "$PT" = "$CT" ] || { echo "FAIL: /v1/mcp/tools differ (or empty)"; exit 1; }
            printf '%s' "$CT" | grep -q tickets__list_tickets || { echo "FAIL: no tickets tools"; exit 1; }
            # 3) one short chat end-to-end (the scripted MockEngine reply)
            R=$(curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' \
              -d '{"messages":[{"role":"user","content":"hi"}]}' "$W/v1/chat/completions")
            printf '%s' "$R" | grep -q 'Hello from the mock engine.' \
              || { echo "FAIL: bad chat: $R"; exit 1; }
            # 4) the ticket server's selftest questions through the canary
            T=$(curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' \
              -d '{"name":"tickets__list_tickets","arguments":{}}' "$W/v1/mcp/call")
            printf '%s' "$T" | grep -q '"ok":[[:space:]]*true' \
              || { echo "FAIL: list_tickets: $T"; exit 1; }
            ID=$(printf '%s' "$T" | grep -o 'T-[0-9][0-9]*' | head -1)
            [ -n "$ID" ] || { echo "FAIL: no ticket id"; exit 1; }
            G=$(curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' \
              -d "{\"name\":\"tickets__get_ticket\",\"arguments\":{\"id\":\"$ID\"}}" "$W/v1/mcp/call")
            printf '%s' "$G" | grep -q '"ok":[[:space:]]*true' \
              || { echo "FAIL: get_ticket: $G"; exit 1; }
            F=$(curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' \
              -d '{"name":"tickets__repo_facts","arguments":{}}' "$W/v1/mcp/call")
            printf '%s' "$F" | grep -q 'no git was asked' \
              || { echo "FAIL: repo_facts: $F"; exit 1; }
            # the read-only four: asked and answered through the canary
            for Q in '{"name":"tickets__search_tickets","arguments":{"query":"T-9001"}}' \
                     '{"name":"tickets__list_docs","arguments":{}}' \
                     '{"name":"tickets__read_doc","arguments":{"name":"STATE.md"}}' \
                     '{"name":"tickets__search_docs","arguments":{"query":"the"}}'; do
              A=$(curl -fsS --max-time 10 -X POST -H 'Content-Type: application/json' \
                -d "$Q" "$W/v1/mcp/call")
              printf '%s' "$A" | grep -q '"ok":[[:space:]]*true' \
                || { echo "FAIL: $Q -> $A"; exit 1; }
            done
            echo "pre-rollout suite: PASS (health, tool equality, chat, 7 selftest questions)"
      - name: load-test
        type: rollout
        url: http://loadtester.chudmax/
        timeout: 5s
        metadata:
          cmd: |
            hey -z 50s -q 10 -c 2 -m POST \
              -H "Content-Type: application/json" \
              -d '{"messages":[{"role":"user","content":"hi"}]}' \
              -host chudmax.rehearsal \
              ${TRAEFIK_URL}/v1/chat/completions
