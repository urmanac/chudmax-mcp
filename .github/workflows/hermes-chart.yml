# The phase-9 CI: the hermes-agent chart is proven in both variants (literal
# key -> chart-created Secret; existingSecret -> the placement path), the
# render guard is asserted as a NEGATIVE test (defaults must fail — the
# upstream API server refuses to run without its bearer key), and the kind job
# runs the full rehearsal (kind-smoke.sh): three releases in one namespace
# (engine pointer + mcp + hermes — all charts consumed READ-ONLY from their
# in-tree paths; no umbrella edits: phase 7 runs in parallel), pod-delete
# survival, backup -> fresh PVC -> import restore, a chat through the Service
# answered by the mock engine on the docker bridge, and the mcp chart's
# same-namespace ingress admission.
#
# No image job: nothing is built (the upstream image is pulled; the two mcp
# pod images are built inside the kind job from the repo's existing
# Dockerfiles — podman first — because their chart-default tags stay
# unpublished until phase 10).
#
# The honest framing (printed by the script): the "engine" is the phase-6 mock
# (Strata --engine mock, outside kind on the docker bridge) — NOT the real
# engine. kind needs systemd cgroup delegation — a rootless sandbox cannot
# host it; the kind job on GitHub's rootful runners is the authoritative
# receipt (the phase-5/6 precedent).

name: hermes-chart

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: lint (the key variants — the bare defaults fail by the guard's design)
        run: |
          helm lint k8s/chart/hermes-agent --set apiServer.key=phase9-kind-rehearsal-key-not-a-secret
          helm lint k8s/chart/hermes-agent --set apiServer.existingSecret=hermes-prod
      - name: kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xf /tmp/kubeconform.tgz -C /tmp kubeconform
      - name: "template + kubeconform (literal-key variant; existingSecret variant; the guard is a NEGATIVE test)"
        run: |
          helm template rel k8s/chart/hermes-agent --set apiServer.key=phase9-kind-rehearsal-key-not-a-secret > /tmp/hermes-key.yaml
          helm template rel k8s/chart/hermes-agent --set apiServer.existingSecret=hermes-prod > /tmp/hermes-ref.yaml
          grep -q 'kind: Secret' /tmp/hermes-key.yaml
          ! grep -q 'kind: Secret' /tmp/hermes-ref.yaml
          if helm template rel k8s/chart/hermes-agent > /dev/null 2>&1; then
            echo "::error::the render guard failed to fire — the bare defaults rendered without a key"
            exit 1
          fi
          /tmp/kubeconform -strict -summary /tmp/hermes-key.yaml /tmp/hermes-ref.yaml
      - name: securityContext shape (no runAsNonRoot on the hermes pod; seccomp kept; passthrough merges)
        run: |
          helm template rel k8s/chart/hermes-agent --set apiServer.key=k --show-only templates/deployment.yaml > /tmp/hermes-dep.yaml
          ! grep -qE '^ *runAsNonRoot:' /tmp/hermes-dep.yaml
          grep -q 'type: RuntimeDefault' /tmp/hermes-dep.yaml
          helm template rel k8s/chart/hermes-agent --set apiServer.key=k \
            --set securityContext.runAsUser=65532 --show-only templates/deployment.yaml \
            | grep -A3 'securityContext:' | grep -q 'runAsUser: 65532'
      - name: LAN-address hygiene (no RFC1918-shaped address in any phase-9 public artifact)
        run: |
          ! grep -RInE '\b(10|172|192)\.[0-9]+\.[0-9]+\.[0-9]+\b' \
            k8s/chart/hermes-agent .github/workflows/hermes-chart.yml

  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: chudmax-phase9
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
      - name: the phase-9 rehearsal (kind-smoke.sh — the whole proof; the log goes to a file so the next step can receipt it)
        env:
          CLUSTER: chudmax-phase9
        run: bash k8s/chart/hermes-agent/kind-smoke.sh > "$RUNNER_TEMP/smoke.log" 2>&1
      - name: the receipt (the log lands in the run summary; the tail rides in the annotations on failure)
        if: always()
        run: |
          cat "$RUNNER_TEMP/smoke.log" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if ! grep -q "RECEIPT: all phase-9 checks passed" "$RUNNER_TEMP/smoke.log" 2>/dev/null; then
            echo "::error::the phase-9 kind rehearsal failed - the log tail (last 40 lines) follows"
            tail -n 40 "$RUNNER_TEMP/smoke.log" | cut -c1-200 > /tmp/smoke-tail.txt
            split -l 8 -d /tmp/smoke-tail.txt /tmp/smoke-tail-
            for f in /tmp/smoke-tail-*; do echo "::error::$(tr '\n' '|' < "$f")"; done
          fi
      - name: the failure receipt
        if: failure()
        run: |
          kind export logs /tmp/kind-logs --name chudmax-phase9 || true
          find /tmp/kind-logs -name '*.log' -exec tail -n 30 {} + 2>/dev/null || true
