# The umbrella chart's CI (the phase-10 shape): the engine and web charts moved
# to their own public repos at the phase-10 split (urmanac/chudmax-engine,
# urmanac/chudmax-web — their validate+publish pipelines live there), so this
# workflow proves the umbrella against the PUBLISHED references: the chart job
# resolves the OCI deps credential-free (the packages are public) and
# lints/templates/kubeconforms both variants, and the kind job runs the full
# umbrella rehearsal (kind-smoke.sh) — which now PULLS the published web image
# (urmanac/chudmax-web's CI builds it) while still building this repo's two
# pod images from the in-repo Dockerfiles.
#
# The rehearsal's honest framing (printed by the script): the /health-through-
# the-engine-Service proof exercises the Service→EndpointSlice→external-host
# path against the mock engine (the published web image, --engine mock, outside
# kind on the docker bridge) — NOT the real engine; the commit→tickets data
# path is phase 5's rehearsal (rehearsal-sync.yml, that card's file).
#
# CI ordering note: the dep resolution and the web-image pull need the GHCR
# packages PUBLIC (the phase-10 flips) — until then these jobs fail on the
# 401/404, which is the honest state, not a defect.

name: umbrella-kind

on:
  push:
    branches: [main]
  pull_request:

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: resolve the published OCI deps (credential-free; public packages)
        run: |
          rm -rf k8s/umbrella/chudmax/charts
          helm dependency update k8s/umbrella/chudmax
      - name: lint the mcp chart + the umbrella (deps resolved first)
        run: |
          helm lint k8s/chart/chudmax-mcp
          helm lint k8s/umbrella/chudmax
      - name: kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xf /tmp/kubeconform.tgz -C /tmp kubeconform
      - name: "template + kubeconform (umbrella: defaults + the RFC 5737 engine-address variant; no Cilium CRDs on stock kind)"
        run: |
          helm template rel k8s/umbrella/chudmax > /tmp/umb-defaults.yaml
          helm template rel k8s/umbrella/chudmax --set engine.endpoint.host=203.0.113.10 > /tmp/umb-endpoint.yaml
          ! grep -qEi 'kind: *CiliumNetworkPolicy|apiVersion: *cilium\.io/' /tmp/umb-defaults.yaml
          ! grep -qEi 'kind: *CiliumNetworkPolicy|apiVersion: *cilium\.io/' /tmp/umb-endpoint.yaml
          /tmp/kubeconform -strict -summary /tmp/umb-defaults.yaml
          /tmp/kubeconform -strict -summary /tmp/umb-endpoint.yaml
      - name: LAN-address hygiene (no RFC1918-shaped address in any public artifact; TEST-NET-3 203.0.113.10 is the only IP in templates)
        run: |
          ! grep -RInE '\b(10|172|192)\.[0-9]+\.[0-9]+\.[0-9]+\b' \
            k8s/umbrella/chudmax .github/workflows/umbrella-kind.yml --exclude-dir=charts

  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman
      - name: the umbrella rehearsal (kind-smoke.sh — the whole proof; the log goes to a file so the next step can receipt it)
        run: bash k8s/umbrella/chudmax/kind-smoke.sh > "$RUNNER_TEMP/smoke.log" 2>&1
      - name: the receipt (the log lands in the run summary; the tail rides in the annotations on failure)
        if: always()
        run: |
          cat "$RUNNER_TEMP/smoke.log" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          if ! grep -q "RECEIPT" "$RUNNER_TEMP/smoke.log" 2>/dev/null; then
            echo "::error::the kind rehearsal failed - the log tail (last 40 lines) follows"
            tail -n 40 "$RUNNER_TEMP/smoke.log" | cut -c1-200 > /tmp/smoke-tail.txt
            split -l 8 -d /tmp/smoke-tail.txt /tmp/smoke-tail-
            for f in /tmp/smoke-tail-*; do echo "::error::$(tr '\n' '|' < "$f")"; done
          fi
      - name: the failure receipt
        if: failure()
        run: |
          kind export logs /tmp/kind-logs --name chudmax-phase6 || true
          find /tmp/kind-logs -name '*.log' -exec tail -n 30 {} + 2>/dev/null || true
